{% extends "base.html" %}
{% load crispy_forms_tags %}


{% block title %}
  Feedback to site admin
{% endblock %}


{% block content %}

  <div class="page-header">
    <h1>Feedback <small>to site admin</small></h1>
  </div>

  <form action="" method="post" id="feedback" class="form">
    {% csrf_token %}

    {{ feedback_form|crispy }}

    <button type="submit" class="btn btn-primary">
      <i class="fa-solid fa-envelope"></i>
      Send to site administrator
    </button>
  </form>

{% endblock %}
