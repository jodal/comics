{% extends "account/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Set password{% endblock %}

{% block content %}

<h1 class="page-header">
  Set Password
</h1>

<form method="post" action="{% url "account_set_password" %}">
  {% csrf_token %}

  {{ form|crispy }}

  <button type="submit" class="btn btn-primary">
    Set password
  </button>
</form>

{% endblock %}
